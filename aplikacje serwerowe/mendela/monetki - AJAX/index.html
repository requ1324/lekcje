<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monetki AJAX</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 20px;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        max-width: 1200px;
      }

      th,
      td {
        border: 1px solid #000;
        text-align: center;
        padding: 6px;
      }

      input,
      select,
      button {
        height: 30px;
      }

      .small {
        width: 90px;
      }

      .medium {
        width: 130px;
      }

      .msg {
        margin: 10px 0;
        min-height: 20px;
        font-weight: bold;
      }

      .row-actions {
        display: flex;
        justify-content: center;
        gap: 6px;
      }
    </style>
    <script src="script.js" defer></script>
  </head>
  <body onload="init()">
    <h2>Monetki - CRUD AJAX</h2>
    <div id="msg" class="msg"></div>

    <table>
      <thead>
        <tr>
          <th>Flaga</th>
          <th>Kraj</th>
          <th>Rok</th>
          <th>Kategoria</th>
          <th>Nominał</th>
          <th>Stop</th>
          <th>Operacje</th>
        </tr>
      </thead>
      <tbody id="add-row"></tbody>
      <tbody id="rows"></tbody>
    </table>
  </body>
</html>
